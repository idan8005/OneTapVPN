name: Build, test and release Raahat VPN

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_emulator_test:
        description: "Run the optional Android emulator UI smoke test"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: raahatvpn-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout source and OpenVPN submodule
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify debug APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test "$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)" -gt 1000000

      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RaahatVPN-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare stable release signing key
        id: release_signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" || -z "${ANDROID_KEYSTORE_PASSWORD}" || -z "${ANDROID_KEY_ALIAS}" || -z "${ANDROID_KEY_PASSWORD}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Stable release signing secrets are not configured. Debug APK is available; signed releases are disabled." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/raahatvpn-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Stable release signing key validated." >> "$GITHUB_STEP_SUMMARY"

      - name: Require release signing for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_CONFIGURED: ${{ steps.release_signing.outputs.configured }}
        run: |
          test "$SIGNING_CONFIGURED" = "true" || {
            echo "A stable release signing key is required for tagged releases." >&2
            exit 1
          }

      - name: Build signed Release APK
        if: steps.release_signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:verifyReleaseSigningConfigured :app:assembleRelease

      - name: Verify Release signature and checksum
        if: steps.release_signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" | tee release-signature.txt
          cp "$APK" raahat-vpn.apk
          sha256sum raahat-vpn.apk > raahat-vpn.apk.sha256
          echo "Signed Release APK verified successfully." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish signed Release artifact
        if: steps.release_signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RaahatVPN-Release-1.4.0
          path: |
            raahat-vpn.apk
            raahat-vpn.apk.sha256
            release-signature.txt
          if-no-files-found: error
          retention-days: 30

      - name: Optional Android emulator UI smoke test
        if: github.event_name == 'workflow_dispatch' && inputs.run_emulator_test
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          avd-name: raahatvpn-ci
          force-avd-creation: true
          emulator-port: 5554
          emulator-boot-timeout: 600
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Report optional emulator test result
        if: always() && github.event_name == 'workflow_dispatch' && inputs.run_emulator_test
        run: echo "The emulator smoke test does not replace testing on a physical Android phone."

  publish_release:
    name: Publish versioned GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified signed APK
        uses: actions/download-artifact@v4
        with:
          name: RaahatVPN-Release-1.4.0
          path: release

      - name: Publish APK and checksum
        uses: softprops/action-gh-release@v2
        with:
          name: Raahat VPN ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/raahat-vpn.apk
            release/raahat-vpn.apk.sha256
