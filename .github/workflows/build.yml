name: Build, test and sign Raahat VPN

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_emulator_test:
        description: "Run the optional Android emulator UI smoke test"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: raahatvpn-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build Android packages
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug :app:lintRelease

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build Debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify Debug APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test "$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)" -gt 1000000

      - name: Publish Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RaahatVPN-Debug-1.4.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare stable release signing key
        id: release_signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" || -z "${ANDROID_KEYSTORE_PASSWORD}" || -z "${ANDROID_KEY_ALIAS}" || -z "${ANDROID_KEY_PASSWORD}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured. Debug build and tests completed; signed Release was skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/raahatvpn-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Stable release signing key validated." >> "$GITHUB_STEP_SUMMARY"

      - name: Build signed Release APK and App Bundle
        if: steps.release_signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:verifyReleaseSigningConfigured :app:assembleRelease :app:bundleRelease

      - name: Verify Release signature and checksums
        if: steps.release_signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee release-signature.txt
          sha256sum "$APK" > app-release.apk.sha256
          sha256sum "$AAB" > app-release.aab.sha256
          echo "Signed APK and Android App Bundle verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish signed Release packages
        if: steps.release_signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RaahatVPN-Release-1.4.0
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app-release.apk.sha256
            app-release.aab.sha256
            release-signature.txt
          if-no-files-found: error
          retention-days: 30

      - name: Optional Android emulator UI smoke test
        if: github.event_name == 'workflow_dispatch' && inputs.run_emulator_test
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37
          target: google_apis
          arch: x86_64
          profile: pixel_2
          avd-name: raahatvpn-ci
          force-avd-creation: true
          emulator-port: 5554
          emulator-boot-timeout: 600
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Report optional emulator test result
        if: always() && github.event_name == 'workflow_dispatch' && inputs.run_emulator_test
        run: echo "The emulator smoke test is optional and does not block APK publication. Physical-device testing is still required."
