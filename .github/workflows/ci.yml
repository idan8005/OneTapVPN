name: Raahat VPN CI

on:
  push:
    branches:
      - main
      - rebuild/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: backend/go.mod
      - run: gofmt -w $(find . -name '*.go')
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/api

  android:
    name: Android build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build and test debug APKs
        working-directory: clients/android
        run: gradle :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RaahatVPN-Android-Debug
          path: clients/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - id: signing
        name: Prepare optional persistent release signing key
        shell: bash
        env:
          RAAHAT_ANDROID_KEYSTORE_BASE64: ${{ secrets.RAAHAT_ANDROID_KEYSTORE_BASE64 }}
          RAAHAT_ANDROID_STORE_PASSWORD: ${{ secrets.RAAHAT_ANDROID_STORE_PASSWORD }}
          RAAHAT_ANDROID_KEY_ALIAS: ${{ secrets.RAAHAT_ANDROID_KEY_ALIAS }}
          RAAHAT_ANDROID_KEY_PASSWORD: ${{ secrets.RAAHAT_ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$RAAHAT_ANDROID_KEYSTORE_BASE64" || -z "$RAAHAT_ANDROID_STORE_PASSWORD" || -z "$RAAHAT_ANDROID_KEY_ALIAS" || -z "$RAAHAT_ANDROID_KEY_PASSWORD" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Persistent signing key is not configured; signed release build is skipped."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/raahat-release.jks"
          printf '%s' "$RAAHAT_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "RAAHAT_ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: clients/android
        env:
          RAAHAT_ANDROID_STORE_PASSWORD: ${{ secrets.RAAHAT_ANDROID_STORE_PASSWORD }}
          RAAHAT_ANDROID_KEY_ALIAS: ${{ secrets.RAAHAT_ANDROID_KEY_ALIAS }}
          RAAHAT_ANDROID_KEY_PASSWORD: ${{ secrets.RAAHAT_ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease
      - name: Verify release APK signatures
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          APKS=(clients/android/app/build/outputs/apk/release/*.apk)
          if [[ ${#APKS[@]} -eq 0 ]]; then
            echo "No release APKs were produced." >&2
            exit 1
          fi
          for APK in "${APKS[@]}"; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          done
      - name: Upload persistent-signed release APKs
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RaahatVPN-Android-Release-Signed
          path: clients/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  windows:
    name: Windows client build and tunnel validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Download and verify official sing-box Windows core
        shell: pwsh
        run: |
          $version = "1.14.4"
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$version/sing-box-$version-windows-amd64.zip"
          $expected = "99185d75d314a07dbba4a130c8ad986cbeb629a07927975636b341ca61f991df"
          $archive = Join-Path $env:RUNNER_TEMP "sing-box-windows-amd64.zip"
          $extract = Join-Path $env:RUNNER_TEMP "sing-box-windows-amd64"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Official sing-box archive checksum mismatch."
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $engine = Get-ChildItem -LiteralPath $extract -Filter "sing-box.exe" -File -Recurse | Select-Object -First 1
          if (-not $engine) {
            throw "sing-box.exe was not present in the verified official archive."
          }
          $coreDirectory = Join-Path $env:GITHUB_WORKSPACE "artifacts/windows/Core"
          New-Item -ItemType Directory -Path $coreDirectory -Force | Out-Null
          Copy-Item -LiteralPath $engine.FullName -Destination (Join-Path $coreDirectory "sing-box.exe")
          $noticeDirectory = Join-Path $env:GITHUB_WORKSPACE "artifacts/windows/licenses"
          New-Item -ItemType Directory -Path $noticeDirectory -Force | Out-Null
          Copy-Item -LiteralPath "licenses/sing-box-1.14.4-NOTICE.txt" -Destination $noticeDirectory
          & (Join-Path $coreDirectory "sing-box.exe") version
      - name: Test profile parser and generated VPN configuration
        shell: pwsh
        run: |
          $enginePath = Join-Path $env:GITHUB_WORKSPACE "artifacts/windows/Core/sing-box.exe"
          dotnet run --configuration Release --project clients/windows-verification/RaahatVPN.Verification.csproj -- "$enginePath"
      - name: Publish self-contained Windows client
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $env:RUNNER_TEMP "raahat-windows-publish"
          dotnet publish clients/windows/RaahatVPN.csproj -c Release -r win-x64 --self-contained true -o $publishDirectory
          New-Item -ItemType Directory -Path "artifacts/windows" -Force | Out-Null
          Copy-Item -Path "$publishDirectory\*" -Destination "artifacts/windows" -Recurse -Force
          if (-not (Test-Path "artifacts/windows/RaahatVPN.exe")) {
            throw "Windows application executable was not published."
          }
          if (-not (Test-Path "artifacts/windows/Core/sing-box.exe")) {
            throw "The verified VPN engine is missing from the Windows package."
          }
          Copy-Item -LiteralPath "clients/windows/README_FA.txt" -Destination "artifacts/windows/راهنمای-فارسی.txt"
          Copy-Item -LiteralPath "clients/windows/START_RAahat_VPN.cmd" -Destination "artifacts/windows/شروع-راحت-وی-پی-ان.cmd"
          if (-not (Test-Path "artifacts/windows/راهنمای-فارسی.txt") -or -not (Test-Path "artifacts/windows/شروع-راحت-وی-پی-ان.cmd")) {
            throw "Windows quick-start files are missing from the package."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: RaahatVPN-Windows-x64
          path: artifacts/windows/
          if-no-files-found: error

  ios-core:
    name: iOS shared core tests and native engine framework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Swift core package
        run: swift test --package-path clients/ios
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v1.14.4
          path: vendor/sing-box
      - name: Install pinned Go mobile binding tools
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gomobile" version
      - name: Generate official sing-box iOS device and simulator framework
        working-directory: vendor/sing-box
        run: |
          gomobile init
          go run ./cmd/internal/build_libbox -target apple -platform ios,iossimulator
          test -d Libbox.xcframework
          test -f Libbox.xcframework/Info.plist
          plutil -lint Libbox.xcframework/Info.plist
          plutil -p Libbox.xcframework/Info.plist
      - uses: actions/upload-artifact@v4
        with:
          name: RaahatVPN-iOS-Libbox-1.14.4
          path: vendor/sing-box/Libbox.xcframework/
          if-no-files-found: error
