name: Publish Raahat iPhone companion

on:
  push:
    branches: [main]
    paths:
      - "clients/ios-companion/index.html"
      - "clients/ios-companion/app.js"
      - "clients/ios-companion/manifest.webmanifest"
      - "clients/ios-companion/sw.js"
      - "clients/ios-companion/icon.svg"
      - ".github/workflows/ios-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: raahat-iphone-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only the iPhone companion
        uses: actions/upload-pages-artifact@v4
        with:
          path: clients/ios-companion
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
