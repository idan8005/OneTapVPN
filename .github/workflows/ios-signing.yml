name: Raahat VPN — Signed iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  signed-ios:
    name: Sign and package iOS app for registered devices
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v1.14.4
          path: vendor/sing-box

      - name: Restore official Libbox iOS framework
        id: libbox-cache
        uses: actions/cache@v4
        with:
          path: vendor/sing-box/Libbox.xcframework
          key: raahat-libbox-ios-1.14.4-go1.26-gomobile0.1.13-iphoneos-simulator

      - name: Download verified Libbox framework artifact when cache is empty
        id: libbox-artifact
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: RaahatVPN-iOS-Libbox-1.14.4
          run-id: 45059979762
          github-token: ${{ github.token }}
          path: vendor/sing-box/Libbox.xcframework

      - name: Build Libbox framework if no cached copy is available
        if: steps.libbox-cache.outputs.cache-hit != 'true' && steps.libbox-artifact.outcome != 'success'
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          gomobile init
          cd vendor/sing-box
          go run ./cmd/internal/build_libbox -target apple -platform ios,iossimulator

      - name: Validate and link official Libbox framework
        run: |
          set -euo pipefail
          test -d vendor/sing-box/Libbox.xcframework/ios-arm64/Libbox.framework
          test -d vendor/sing-box/Libbox.xcframework/ios-arm64_x86_64-simulator/Libbox.framework
          mkdir -p clients/ios/Frameworks
          cp -R vendor/sing-box/Libbox.xcframework clients/ios/Frameworks/Libbox.xcframework

      - name: Install Apple signing certificate and provisioning profiles
        id: signing
        shell: bash
        env:
          TEAM_ID: ${{ secrets.RAAHAT_IOS_TEAM_ID }}
          CERTIFICATE_P12_BASE64: ${{ secrets.RAAHAT_IOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_P12_PASSWORD: ${{ secrets.RAAHAT_IOS_CERTIFICATE_P12_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.RAAHAT_IOS_APP_PROFILE_BASE64 }}
          EXTENSION_PROFILE_BASE64: ${{ secrets.RAAHAT_IOS_EXTENSION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for name in TEAM_ID CERTIFICATE_P12_BASE64 CERTIFICATE_P12_PASSWORD APP_PROFILE_BASE64 EXTENSION_PROFILE_BASE64; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions secrets (values are not printed): %s\n' "${missing[*]}" >&2
            exit 1
          fi

          P12_PATH="$RUNNER_TEMP/raahat-ios-development.p12"
          APP_PROFILE_PATH="$RUNNER_TEMP/raahat-ios-app.mobileprovision"
          EXT_PROFILE_PATH="$RUNNER_TEMP/raahat-ios-extension.mobileprovision"
          APP_PLIST="$RUNNER_TEMP/raahat-ios-app-profile.plist"
          EXT_PLIST="$RUNNER_TEMP/raahat-ios-extension-profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/raahat-ios-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "RAAHAT_IOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          export P12_PATH APP_PROFILE_PATH EXT_PROFILE_PATH
          python3 - <<'PY'
          import base64, os
          for env_name, path_var in (
              ("CERTIFICATE_P12_BASE64", "P12_PATH"),
              ("APP_PROFILE_BASE64", "APP_PROFILE_PATH"),
              ("EXTENSION_PROFILE_BASE64", "EXT_PROFILE_PATH"),
          ):
              encoded = os.environ[env_name].strip()
              with open(os.environ[path_var], "wb") as f:
                  f.write(base64.b64decode(encoded, validate=True))
          PY
          chmod 600 "$P12_PATH" "$APP_PROFILE_PATH" "$EXT_PROFILE_PATH"

          security cms -D -i "$APP_PROFILE_PATH" -o "$APP_PLIST"
          security cms -D -i "$EXT_PROFILE_PATH" -o "$EXT_PLIST"

          profile_value() {
            /usr/libexec/PlistBuddy -c "Print $2" "$1"
          }
          APP_TEAM="$(profile_value "$APP_PLIST" ':TeamIdentifier:0')"
          EXT_TEAM="$(profile_value "$EXT_PLIST" ':TeamIdentifier:0')"
          APP_PREFIX="$(profile_value "$APP_PLIST" ':ApplicationIdentifierPrefix:0')"
          EXT_PREFIX="$(profile_value "$EXT_PLIST" ':ApplicationIdentifierPrefix:0')"
          APP_IDENTIFIER="$(profile_value "$APP_PLIST" ':Entitlements:application-identifier')"
          EXT_IDENTIFIER="$(profile_value "$EXT_PLIST" ':Entitlements:application-identifier')"
          APP_PROFILE_NAME="$(profile_value "$APP_PLIST" ':Name')"
          EXT_PROFILE_NAME="$(profile_value "$EXT_PLIST" ':Name')"
          APP_PROFILE_UUID="$(profile_value "$APP_PLIST" ':UUID')"
          EXT_PROFILE_UUID="$(profile_value "$EXT_PLIST" ':UUID')"
          APP_GROUPS="$(profile_value "$APP_PLIST" ':Entitlements:com.apple.security.application-groups')"
          EXT_GROUPS="$(profile_value "$EXT_PLIST" ':Entitlements:com.apple.security.application-groups')"
          EXT_NETWORK_ENTITLEMENTS="$(profile_value "$EXT_PLIST" ':Entitlements:com.apple.developer.networking.networkextension')"

          [[ "$APP_TEAM" == "$TEAM_ID" && "$EXT_TEAM" == "$TEAM_ID" ]] || { echo "Provisioning profile Team ID mismatch." >&2; exit 1; }
          [[ "$APP_IDENTIFIER" == "$APP_PREFIX.com.raahat.vpn" ]] || { echo "App provisioning profile must match com.raahat.vpn." >&2; exit 1; }
          [[ "$EXT_IDENTIFIER" == "$EXT_PREFIX.com.raahat.vpn.packet-tunnel" ]] || { echo "Extension provisioning profile must match com.raahat.vpn.packet-tunnel." >&2; exit 1; }
          [[ "$APP_GROUPS" == *"group.com.raahat.vpn"* && "$EXT_GROUPS" == *"group.com.raahat.vpn"* ]] || { echo "Both profiles must include App Group group.com.raahat.vpn." >&2; exit 1; }
          [[ "$EXT_NETWORK_ENTITLEMENTS" == *"packet-tunnel-provider"* ]] || { echo "Extension profile must include the packet-tunnel-provider Network Extension entitlement." >&2; exit 1; }

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          cp "$APP_PROFILE_PATH" "$PROFILE_DIR/$APP_PROFILE_UUID.mobileprovision"
          cp "$EXT_PROFILE_PATH" "$PROFILE_DIR/$EXT_PROFILE_UUID.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          if ! printf '%s\n' "$IDENTITIES" | grep -q 'Apple Development:'; then
            echo "The P12 must contain a valid Apple Development certificate with its private key." >&2
            exit 1
          fi

          {
            echo "RAAHAT_IOS_TEAM_ID=$TEAM_ID"
            echo "RAAHAT_IOS_APP_PROFILE=$APP_PROFILE_NAME"
            echo "RAAHAT_IOS_EXTENSION_PROFILE=$EXT_PROFILE_NAME"
          } >> "$GITHUB_ENV"
          {
            echo "app_profile_name=$APP_PROFILE_NAME"
            echo "extension_profile_name=$EXT_PROFILE_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Generate Xcode project and archive signed iOS app
        run: |
          set -euo pipefail
          brew install xcodegen
          cd clients/ios
          xcodegen generate
          xcodebuild -project RaahatVPN.xcodeproj -scheme RaahatVPN -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/RaahatVPN.xcarchive" -derivedDataPath "$RUNNER_TEMP/RaahatVPN-derived" CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES RAAHAT_IOS_TEAM_ID="$RAAHAT_IOS_TEAM_ID" RAAHAT_IOS_APP_PROFILE="$RAAHAT_IOS_APP_PROFILE" RAAHAT_IOS_EXTENSION_PROFILE="$RAAHAT_IOS_EXTENSION_PROFILE" archive

      - name: Export and verify signed development IPA
        env:
          APP_PROFILE_NAME: ${{ steps.signing.outputs.app_profile_name }}
          EXTENSION_PROFILE_NAME: ${{ steps.signing.outputs.extension_profile_name }}
        run: |
          set -euo pipefail
          EXPORT_OPTIONS="$RUNNER_TEMP/RaahatVPN-ExportOptions.plist"
          EXPORT_DIR="$RUNNER_TEMP/RaahatVPN-export"
          export EXPORT_OPTIONS
          python3 - <<'PY'
          import os, plistlib
          options = {
              "method": "development",
              "signingStyle": "manual",
              "teamID": os.environ["RAAHAT_IOS_TEAM_ID"],
              "provisioningProfiles": {
                  "com.raahat.vpn": os.environ["APP_PROFILE_NAME"],
                  "com.raahat.vpn.packet-tunnel": os.environ["EXTENSION_PROFILE_NAME"],
              },
              "stripSwiftSymbols": True,
          }
          with open(os.environ["EXPORT_OPTIONS"], "wb") as f:
              plistlib.dump(options, f)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/RaahatVPN.xcarchive" -exportPath "$EXPORT_DIR" -exportOptionsPlist "$EXPORT_OPTIONS"
          IPA_PATH="$(find "$EXPORT_DIR" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          mkdir -p artifacts/ios
          cp "$IPA_PATH" artifacts/ios/RaahatVPN-iOS-Development.ipa

          VERIFY_DIR="$RUNNER_TEMP/raahat-ipa-verify"
          mkdir -p "$VERIFY_DIR"
          ditto -x -k artifacts/ios/RaahatVPN-iOS-Development.ipa "$VERIFY_DIR"
          APP_PATH="$VERIFY_DIR/Payload/RaahatVPN.app"
          EXT_PATH="$APP_PATH/PlugIns/RaahatPacketTunnel.appex"
          test -d "$APP_PATH"
          test -d "$EXT_PATH"
          test -f "$APP_PATH/embedded.mobileprovision"
          test -f "$EXT_PATH/embedded.mobileprovision"
          codesign --verify --deep --strict "$APP_PATH"
          codesign --verify --strict "$EXT_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -E 'Identifier=|TeamIdentifier='
          cat > artifacts/ios/INSTALL-FA.txt <<'EOF'
          راحت وی‌پی‌ان — نسخهٔ توسعهٔ امضاشده برای iPhone
          این IPA با Apple Development certificate و دو provisioning profile مجزا ساخته شده است.
          دستگاه مقصد باید در پروفایل توسعه ثبت شده باشد.
          برنامه را فقط روی دستگاه‌های مجاز همان Apple Developer Team نصب کنید.
          موفقیت امضا به معنی آزمون عملکرد VPN یا بررسی نشت DNS/IPv6 نیست؛ اتصال واقعی باید روی دستگاه آزمایش شود.
          EOF

      - name: Upload signed iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: RaahatVPN-iOS-Development-IPA
          path: artifacts/ios/
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          if [[ -n "${RAAHAT_IOS_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$RAAHAT_IOS_KEYCHAIN_PATH" >/dev/null 2>&1 || true
          fi
          rm -f "$RUNNER_TEMP/raahat-ios-development.p12" \
                "$RUNNER_TEMP/raahat-ios-app.mobileprovision" \
                "$RUNNER_TEMP/raahat-ios-extension.mobileprovision" \
                "$RUNNER_TEMP/raahat-ios-app-profile.plist" \
                "$RUNNER_TEMP/raahat-ios-extension-profile.plist"
