name: RaahatVPN
options:
  bundleIdPrefix: com.raahat
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  RaahatCore:
    path: .
targets:
  RaahatVPN:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
    dependencies:
      - package: RaahatCore
        product: RaahatCore
      - target: RaahatPacketTunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raahat.vpn
        PRODUCT_NAME: RaahatVPN
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Raahat VPN
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: Config/RaahatVPN.entitlements
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
    configFiles:
      Release: Config/RaahatVPN.Release.xcconfig
  RaahatPacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/PacketTunnel
    dependencies:
      - package: RaahatCore
        product: RaahatCore
      - framework: Frameworks/Libbox.xcframework
        embed: false
      - sdk: UIKit.framework
      - sdk: libresolv.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raahat.vpn.packet-tunnel
        PRODUCT_NAME: RaahatPacketTunnel
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
        INFOPLIST_KEY_NSExtension_NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PacketTunnelProvider"
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Config/RaahatPacketTunnel.entitlements
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
    configFiles:
      Release: Config/RaahatPacketTunnel.Release.xcconfig
